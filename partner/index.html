<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CajaModa Partner</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 10%,#e8ebf7,transparent 38%),#faf9f5;color:#111;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(760px,100%);padding:34px;border:1px solid rgba(255,255,255,.8);border-radius:28px;background:rgba(255,255,255,.62);box-shadow:0 28px 80px rgba(42,37,29,.12);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}.brand{font-size:12px;font-weight:800;letter-spacing:.28em}.eyebrow{margin-top:38px;color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.12em}h1{margin:10px 0 0;font-size:clamp(40px,8vw,72px);letter-spacing:-.06em;line-height:.95}p{color:#686b72;line-height:1.6}.status{display:inline-flex;margin-top:18px;padding:9px 12px;border-radius:999px;background:#e8f7ef;color:#26744f;font-size:11px;font-weight:800}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}.checks div{padding:16px;border-radius:16px;background:rgba(255,255,255,.72);font-size:12px}@media(max-width:560px){.shell{padding:24px}.checks{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="brand">CAJAMODA</div><div class="eyebrow">Private commerce network</div><h1 id="business">Connecting…</h1><p id="description">Verifying your prepared CajaModa shell.</p><div id="status" class="status">Testing invitation</div><div id="checks" class="checks"></div></main><script>(async()=>{const token=new URLSearchParams(location.search).get("invite")||"";try{const response=await fetch("/api/partner/invite?token="+encodeURIComponent(token));const data=await response.json();if(!response.ok)throw new Error(data.error);const p=data.partner;document.getElementById("business").textContent=p.business_name;document.getElementById("description").textContent=(p.shell_type||"").replaceAll("_"," ")+" is prepared and isolated inside the CajaModa network.";document.getElementById("status").textContent=(p.status||"").replaceAll("_"," ");document.getElementById("checks").innerHTML=Object.entries(p.readiness||{}).map(([key,value])=>"<div>"+(value?"✓":"○")+" "+key.replaceAll(/([A-Z])/g," $1")+"</div>").join("");}catch(error){document.getElementById("business").textContent="Invitation unavailable";document.getElementById("description").textContent=error.message;document.getElementById("status").textContent="Needs attention";}})();</script></body></html>
